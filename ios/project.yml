name: AskDiary
options:
  bundleIdPrefix: com.davidbocle
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  AskDiaryKit:
    path: AskDiaryKit

targets:
  AskDiary:
    type: application
    platform: iOS
    sources:
      - path: AskDiary/Sources
      - path: AskDiary/Resources
        buildPhase: resources
      # data artifacts shared with the web app, bundled as-is
      - path: ../static/rag
        buildPhase: resources
        type: folder
        group: Data
      - path: ../static/transcripts
        buildPhase: resources
        type: folder
        group: Data
      - path: ../static/embedder/Xenova/all-MiniLM-L6-v2/tokenizer.json
        buildPhase: resources
        group: Data
    dependencies:
      - package: AskDiaryKit
    info:
      path: AskDiary/Info.plist
      properties:
        CFBundleDisplayName: Ask the Diary
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    # iCloud/CloudKit needs the paid Developer Program. Once enrolled,
    # uncomment this block (and run xcodegen) — the SwiftData store is
    # already CloudKit-ready and starts syncing with no code changes.
    # entitlements:
    #   path: AskDiary/AskDiary.entitlements
    #   properties:
    #     com.apple.developer.icloud-services: [CloudKit]
    #     com.apple.developer.icloud-container-identifiers:
    #       - iCloud.com.davidbocle.askdiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidbocle.askdiary
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0

  AskDiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AskDiaryUITests]
    dependencies:
      - target: AskDiary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  AskDiary:
    build:
      targets:
        AskDiary: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AskDiaryUITests
